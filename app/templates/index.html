{% extends "base.html" %}

{% block content %}
    <div class="new recipes carousel">
        <div class="mySlides fade">
            <div class="numbertext">1 / 3</div>
            <img src="https://nationalzoo.si.edu/sites/default/files/paragraphs/single_image/20180628-634sb.jpg" style="width:100%">
        </div>

        <div class="mySlides fade">
            <div class="numbertext">2 / 3</div>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTNf2QMLoXgZE_X7lwivuOoMumMOJEKDcMXrmJNBEHOHA&s" style="width:100%">
        </div>

        <div class="mySlides fade">
            <div class="numbertext">3 / 3</div>
            <img src="https://cms.bbcearth.com/sites/default/files/2025-07/meta-goat-chirag-saini-unsplash-CpBUZ4r7T-4.jpg" style="width:100%">
        </div>

        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>
    <div style="text-align:center">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
    </div>

    
    <div class="mission">
        <h2>Our Mission</h2>
        <p>First Nation's Baking aims to....</p>
    </div>
{% endblock %}
